# Configuracion tmux minima, sin TPM ni plugins.
unbind C-b
set -g prefix C-a
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",screen-256color:Tc"
set -as terminal-overrides ",alacritty:Tc"
set -as terminal-overrides ",xterm-kitty:Tc"

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Estado ASCII portable: sesion, ventanas, Git, agente activo y hora.
set -g status-interval 15
set -g status-style "fg=default,bg=default"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left " #[bold]#S#[default] |"
set -g status-right "#(exec #{q:ENTORNO_NVIM_ROOT}/scripts/tmux-status.sh #{q:session_id}) | %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W#[default] |"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 3
bind J resize-pane -D 3
bind K resize-pane -U 3
bind L resize-pane -R 3

# Ctrl-a Ctrl-a envia un Ctrl-a literal o el prefijo a un tmux remoto.
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navegacion estable por responsabilidad, independiente del layout fisico.
bind n run-shell 'exec "#{ENTORNO_NVIM_ROOT}/scripts/tmux-select-role.sh" editor "#{pane_id}"'
bind a run-shell 'exec "#{ENTORNO_NVIM_ROOT}/scripts/tmux-select-role.sh" agent "#{pane_id}"'
bind t run-shell 'exec "#{ENTORNO_NVIM_ROOT}/scripts/tmux-select-role.sh" terminal "#{pane_id}"'

# El popup no hereda necesariamente TMUX_PANE. El binding resuelve la raiz en
# su sesion y pasa al lanzador el cliente, pane y sesion de origen.
bind P run-shell 'root_entry=$(tmux show-environment -t "#{session_name}" ENTORNO_NVIM_ROOT 2>/dev/null) || { tmux display-message "Error: tmux no conoce ENTORNO_NVIM_ROOT para esta sesion"; exit 1; }; root=${root_entry#*=}; exec "$root/scripts/popup-proyecto.sh" "#{client_name}" "#{pane_id}" "#{session_name}"'
