# Configuracion tmux minima, sin TPM ni plugins.
set -g prefix C-b
set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",screen-256color:Tc"
set -as terminal-overrides ",alacritty:Tc"
set -as terminal-overrides ",xterm-kitty:Tc"

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 3
bind J resize-pane -D 3
bind K resize-pane -U 3
bind L resize-pane -R 3

# Ctrl-b Ctrl-b envia el prefijo a un tmux remoto deliberadamente anidado.
bind C-b send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Los panes existentes no incorporan variables añadidas posteriormente. El
# popup consulta su propia sesion tmux para localizar proyecto.sh.
bind P display-popup -E -b simple -T " Proyectos " -w 85% -h 75% \
  -d "#{pane_current_path}" \
  'root_entry=$(tmux show-environment ENTORNO_NVIM_ROOT 2>/dev/null) || { printf "%s\n" "Error: tmux no conoce ENTORNO_NVIM_ROOT para esta sesion." >&2; exit 1; }; case "$root_entry" in ENTORNO_NVIM_ROOT=*) root=${root_entry#*=} ;; *) printf "%s\n" "Error: ENTORNO_NVIM_ROOT no es valida en esta sesion." >&2; exit 1 ;; esac; [ -n "$root" ] && [ -x "$root/scripts/proyecto.sh" ] || { printf "%s\n" "Error: la raiz de entorno-nvim no contiene scripts/proyecto.sh." >&2; exit 1; }; exec "$root/scripts/proyecto.sh"'
